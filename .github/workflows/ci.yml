name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :core:test
      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # Models too large for the repository: the inpainting model (downloaded by the build) and the
      # sky model (built from DeepLab's TensorFlow graph), kept between runs.
      - uses: actions/cache@v4
        id: models
        with:
          path: app/build/models
          key: models-${{ hashFiles('tools/models/**') }}-lama-1faef5301d78
      - uses: actions/setup-python@v5
        if: steps.models.outputs.cache-hit != 'true'
        with:
          python-version: '3.13'
      - name: Sky model
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          pip install tensorflow-cpu==2.21.0 tf2onnx==1.17.0 onnx==1.23.2 onnxruntime numpy
          python tools/models/sky_model.py app/build/models/assets/sky.onnx
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: headsup-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
